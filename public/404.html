<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AFL Match Recorder</title>
    <script type="text/javascript">
      // Single Page App redirect for GitHub Pages
      // Converts subpaths to hash routes: e.g. /record/po1-g1 -> /#/record/po1-g1
      var pathSegmentsToKeep = 1;

      var l = window.location;
      var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
      var remainder = l.pathname.slice(repoBase.length);
      var hash = remainder ? ('#/' + remainder.replace(/^\//, '')) : '';
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        repoBase + '/?' +
        (l.search ? l.search.slice(1) : '') +
        (hash ? (l.search ? '&' : '') + hash : '')
      );
    </script>
  </head>
  <body>
    <p>Redirecting to AFL Match Recorder...</p>
  </body>
</html>
